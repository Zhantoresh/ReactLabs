<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b4fe0" />
    <title>Offline · Departures Board</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Pre-cached by the Service Worker and shown when a page cannot be loaded without internet.
         Everything is inline: this page must work with no network at all. -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #1d1b33;
        background: #f7f6fc;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        border: 1px solid #e3e0f5;
        border-radius: 16px;
        background: #fff;
        text-align: center;
        box-shadow: 0 10px 30px rgba(91, 79, 224, 0.08);
      }
      .icon { width: 72px; height: 72px; margin: 0 auto 16px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 12px; color: #6b6880; line-height: 1.5; }
      button, a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 20px;
        border: 1px solid #5b4fe0;
        border-radius: 999px;
        background: #5b4fe0;
        color: #fff;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
      a.btn { background: transparent; color: #5b4fe0; }
      .status { min-height: 1.5em; margin-top: 12px; font-size: 14px; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>This page could not be loaded without an internet connection.</p>
      <p>Pages and flights you have already opened are still available in the app.</p>
      <div class="actions">
        <button id="retry" type="button">Retry connection</button>
        <a class="btn" href="./">Open the app</a>
      </div>
      <p class="status" id="status" role="status"></p>
    </main>
    <script>
      const status = document.getElementById("status");

      function goBack() {
        location.replace("./");
      }

      document.getElementById("retry").addEventListener("click", () => {
        if (navigator.onLine) goBack();
        else status.textContent = "Still offline. Check Wi-Fi or mobile data and try again.";
      });


      window.addEventListener("online", goBack);
    </script>
  </body>
</html>
